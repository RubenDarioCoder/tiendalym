<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Tienda · Catálogo de Ropa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== BARRA DE NAVEGACIÓN ===== -->
  <header class="navbar">
    <span class="brand" id="brandTitle">✨ MODA URBANA</span>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button id="cartToggle" class="btn-cart" aria-label="Carrito">🛒 <span id="cartCount">0</span></button>
      <div id="adminButtonContainer"></div>
    </div>
  </header>

  <!-- ===== FILTROS ===== -->
  <div class="filters" id="filterContainer">
    <button class="filter-btn active" data-filter="all">Todos</button>
  </div>

  <!-- ===== CATÁLOGO ===== -->
  <main class="catalog" id="catalogContainer"></main>

  <!-- ===== CARRITO LATERAL ===== -->
  <div id="cartOverlay" class="cart-overlay"></div>
  <div id="cartSidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>🛒 Carrito</h2>
      <button id="cartClose" class="cart-close">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-observations">
      <label for="cartObservations">Observaciones (talle, color, etc.)</label>
      <textarea id="cartObservations" rows="2" placeholder="Ej: Talle M, color negro"></textarea>
    </div>
    <div class="cart-footer">
      <div class="cart-total">Total: <span id="cartTotalPrice">$0.00</span></div>
      <button id="cartWhatsApp" class="btn-whatsapp">📱 Enviar por WhatsApp</button>
    </div>
  </div>

  <!-- ===== MODAL DE LOGIN ===== -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <button class="modal-close" id="loginClose">&times;</button>
      <h2>Acceso Administrador</h2>
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginUser">Usuario</label>
          <input type="text" id="loginUser" placeholder="admin" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="loginPass">Contraseña</label>
          <input type="password" id="loginPass" placeholder="••••" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL ADMIN ===== -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal-card wide">
      <button class="modal-close" id="adminClose">&times;</button>
      <h2>Panel de Administración</h2>
      <form id="productForm">
        <div class="form-row">
          <div class="form-group">
            <label for="prodName">Nombre</label>
            <input type="text" id="prodName" placeholder="Ej: Remera Oversize" required>
          </div>
          <div class="form-group">
            <label for="prodPrice">Precio ($)</label>
            <input type="number" id="prodPrice" placeholder="0.00" step="0.01" required>
          </div>
        </div>
        <div class="form-group">
          <label for="prodCategory">Categoría</label>
          <input type="text" id="prodCategory" placeholder="Ej: Remeras, Pantalones, etc." list="categoryList" required>
          <datalist id="categoryList"></datalist>
        </div>
        <div class="form-group">
          <label for="prodDesc">Descripción</label>
          <textarea id="prodDesc" rows="2" placeholder="Breve descripción..."></textarea>
        </div>
        <div class="form-group">
          <label for="prodColors">Colores disponibles</label>
          <input type="text" id="prodColors" placeholder="Ej: Negro, Blanco, Rojo (separados por coma)" list="colorList">
          <datalist id="colorList"></datalist>
        </div>
        <div class="form-group">
          <label>Imágenes</label>
          <div class="image-input-group">
            <input type="text" id="prodImageUrls" placeholder="URLs separadas por coma (Enter para agregar)">
            <span class="sep">o</span>
            <input type="file" id="prodImageFiles" accept="image/*" multiple>
          </div>
          <div id="imagePreviewContainer" class="image-preview-grid"></div>
        </div>
        <div class="form-group form-check">
          <label>
            <input type="checkbox" id="prodVisible" checked>
            Producto visible en el catálogo
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="saveProductBtn">Guardar Producto</button>
          <button type="reset" class="btn-secondary" id="cancelEditBtn">Cancelar Edición</button>
        </div>
        <input type="hidden" id="editIndex" value="-1">
      </form>
      <hr>
      <div class="admin-list">
        <h3>Productos existentes</h3>
        <div id="adminProductList"></div>
      </div>
      <button id="resetDataBtn" class="btn-danger" style="margin-top:0.5rem; width:100%;">Resetear datos</button>
      <button id="logoutBtn" class="btn-danger" style="margin-top:0.5rem; width:100%;">Cerrar Sesión</button>
    </div>
  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div id="imageLightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="Imagen ampliada">
  </div>
  <!-- ===== MODAL DE ESPECIFICACIONES (Color/Talle) ===== -->
  <div id="especModal" class="modal-overlay">
      <div class="modal-card">
          <h2>Detalle del producto</h2>
          <p class="espec-product-name" id="especProductName"></p>
          <p class="espec-product-price" id="especProductPrice"></p>
          <div class="form-group">
              <label for="especInput">Color / Talle / Nota (opcional)</label>
              <input type="text" id="especInput" placeholder="Ej: Talle M, Color Negro">
              <small>Especifica el color y talle para este producto.</small>
          </div>
          <div class="form-actions">
              <button class="btn-primary" id="especConfirm">Agregar al carrito</button>
              <button class="btn-secondary" id="especCancel">Cancelar</button>
          </div>
      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
